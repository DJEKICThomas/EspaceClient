<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulation — CompanySelection</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn-uicons.flaticon.com/2.6.0/uicons-thin-straight/css/uicons-thin-straight.css" rel="stylesheet">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    min-height: 100vh;
    margin: 0;
  }
  .fake-header {
    display: flex; align-items: center;
    border-bottom: 1px solid #e5e7eb;
    padding: 0 20px; height: 58px;
  }
  .logo-block {
    background: #000; color: #fff;
    padding: 6px 10px; font-size: 14px; font-weight: 800;
    margin-right: 16px;
  }
  .company-chip { color: #f39c12; font-weight: 600; margin-right: 24px; }
  .nav-tabs-fake {
    display: flex; gap: 28px; flex: 1;
    font-size: 13px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .nav-tabs-fake span.active {
    color: #111827;
    border-bottom: 3px solid #f39c12;
    padding-bottom: 18px; margin-top: 18px;
  }

  .page-wrapper {
    max-width: 720px;
    margin: 0 auto;
    padding: 90px 24px 40px;
  }
  .title-block {
    text-align: center;
    margin-bottom: 48px;
  }
  .title-main {
    font-size: 28px; font-weight: 600; color: #111827;
    margin: 0 0 8px 0;
  }
  .title-sub {
    color: #9ca3af; font-size: 14px; margin: 0;
  }

  .companies-list { display: flex; flex-direction: column; }
  .company-row {
    display: flex; align-items: center;
    padding: 22px 4px;
    border-bottom: 1px solid #f3f4f6;
    cursor: pointer;
    transition: all .2s;
    gap: 20px;
  }
  .company-row:last-child { border-bottom: none; }
  .company-row:hover {
    padding-left: 16px; padding-right: 16px;
    background: #fafafa;
  }
  .company-row:hover .company-name { color: #f39c12; }
  .company-row:hover .chevron {
    opacity: 1; transform: translateX(0); color: #f39c12;
  }

  .company-name {
    font-size: 18px; font-weight: 500; color: #111827;
    flex: 1;
    transition: color .2s;
  }
  .company-current {
    font-size: 11px; color: #f39c12;
    background: #fef3c7;
    padding: 3px 10px; border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .chevron {
    color: #d1d5db; font-size: 18px;
    opacity: 0; transform: translateX(-6px);
    transition: all .2s;
  }
  .company-row.current .company-name { color: #f39c12; font-weight: 600; }
</style>
</head>
<body>
  <div class="fake-header">
    <div class="logo-block">MEURER</div>
    <div class="company-chip">[MEU]</div>
    <div class="nav-tabs-fake">
      <span class="active">Société</span>
      <span>Client</span>
      <span>Accueil</span>
      <span>Factures</span>
      <span>Commandes</span>
      <span>Offres</span>
      <span>Abonnements</span>
      <span>Documents</span>
      <span>Historique</span>
      <span>Admin</span>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="title-block">
      <h1 class="title-main">Sélectionnez une société</h1>
      <p class="title-sub">Vous avez accès à 3 sociétés</p>
    </div>

    <div class="companies-list">
      <div class="company-row current">
        <span class="company-name">Meurer</span>
        <span class="company-current">Actuelle</span>
      </div>
      <div class="company-row">
        <span class="company-name">Meurer New Ventures</span>
        <span class="chevron">›</span>
      </div>
      <div class="company-row">
        <span class="company-name">Sovelec</span>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>
</body>
</html>
